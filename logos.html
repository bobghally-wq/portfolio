<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوجوهات</title>
<style>
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    margin-bottom: 30px;
  }

  .btn {
    display: inline-block;
    padding: 12px 30px;
    background: #fff;
    color: #000;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 40px;
  }

  .projects {
    max-width: 800px;
    margin: 0 auto;
  }

  .project {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 30px;
  }

  .project h3 {
    margin-bottom: 15px;
  }

  .project img {
    max-width: 100%;
    border-radius: 8px;
  }
</style>
</head>
<body>

<h1>لوجوهات</h1>

<div class="projects">
  
  <div class="project">
    <h3>Project 1</h3>
    <img src="logo1.jpg" alt="Project 1">
  </div>

  <div class="project">
    <h3>Project 2</h3>
    <p>Project 2</p>
    <img src="logo2.jpg" alt="Project 2">
  </div>

  <div class="project">
    <h3>Project 3</h3>
    <p>Project 3</p>
    <img src="logo3.jpg" alt="Project 3">
  </div>

</div>

</body>
</html>
